<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Atasözü Çarkı · Oyunhane</title>
<meta name="theme-color" content="#1d1340">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{
    --bg:#1d1340; --bg2:#2d1d63; --ink:#fff6e0; --dim:#b9addf; --altin:#f5c542; --mercan:#ef5d60;
    --turkuaz:#2ec4b6; --mor:#7b5cd6; --kart:rgba(24,14,56,.97);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;flex-direction:column;align-items:center;height:100vh;height:100dvh;
    background:radial-gradient(110% 70% at 50% 0%,#4a2f97 0%,var(--bg) 62%) var(--bg);
    padding:calc(8px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
  .sahne{width:100%;max-width:760px;flex:1;min-height:0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
  .home{color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;padding:6px 12px;border-radius:999px;
    background:rgba(12,6,32,.6);border:1px solid rgba(255,255,255,.18);white-space:nowrap}
  .home:hover{background:rgba(12,6,32,.9)}
  .baslik{font-weight:800;font-size:21px;letter-spacing:.4px;color:var(--altin);white-space:nowrap;
    text-shadow:0 2px 0 #7a4b00}
  .snd{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(12,6,32,.6);
    color:var(--ink);font-size:15px;cursor:pointer;flex:none}
  .hud{display:flex;gap:6px;justify-content:center;margin-top:8px;flex:none}
  .pill{background:rgba(12,6,32,.55);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:3px 8px;
    text-align:center;line-height:1.05;min-width:58px}
  .pill small{display:block;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.3px}
  .pill b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;display:inline-block}
  .pill b.pop{animation:pop .35s ease-out}
  @keyframes pop{40%{transform:scale(1.3);color:var(--altin)}}
  .canlar{display:flex;gap:3px;justify-content:center;height:18px;align-items:center}
  .canlar i{width:15px;height:14px;display:block;transition:transform .3s,opacity .3s;
    background:var(--mercan);clip-path:path('M7.5 13.5 1.2 7.2A3.6 3.6 0 0 1 7.5 2.4a3.6 3.6 0 0 1 6.3 4.8Z')}
  .canlar i.yok{opacity:.18;transform:scale(.75)}
  .canlar.sars{animation:sars .4s}
  @keyframes sars{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}

  /* pano */
  .pano{position:relative;margin-top:10px;border-radius:18px;padding:12px;flex:none;
    background:linear-gradient(#3b2582,#24165a);box-shadow:0 6px 0 #120a2c,0 10px 30px rgba(0,0,0,.4)}
  .isik{position:absolute;inset:0;border-radius:18px;pointer-events:none;
    -webkit-mask:linear-gradient(#000,#000) content-box exclude,linear-gradient(#000,#000);
    mask:linear-gradient(#000,#000) content-box exclude,linear-gradient(#000,#000);padding:7px}
  .isik::before,.isik::after{content:"";position:absolute;inset:0;
    background:radial-gradient(circle,#ffe08a 0 2.2px,transparent 2.8px) 0 0/14px 14px}
  .isik::after{background-position:7px 7px;animation:yan 1s steps(1) infinite}
  .isik::before{animation:yan 1s steps(1) infinite .5s}
  .pano.cosku .isik::before,.pano.cosku .isik::after{animation-duration:.25s}
  @keyframes yan{0%{opacity:1}50%{opacity:.15}}
  .ic{position:relative;background:#140c33;border-radius:10px;padding:9px 6px 10px;min-height:96px;
    display:flex;flex-direction:column;align-items:center;justify-content:center}
  .kat{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--altin);margin-bottom:5px;opacity:.9}
  #tiles{display:flex;flex-direction:column;gap:4px;align-items:center;--t:30px}
  .row{display:flex;gap:calc(var(--t)*.38)}
  .w{display:flex;gap:3px}
  .t{width:var(--t);height:calc(var(--t)*1.22);border-radius:5px;perspective:300px;position:relative}
  .t span{position:absolute;inset:0;border-radius:5px;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:calc(var(--t)*.68);line-height:1;padding-top:2px;transition:transform .35s,background .2s,box-shadow .2s;
    background:linear-gradient(#36d6c6,#1d9a8e);box-shadow:inset 0 -3px 0 #137067,inset 0 1px 0 rgba(255,255,255,.4);color:transparent}
  .t.acik span{background:linear-gradient(#fffaf0,#f1e2bd);color:#2a1b55;box-shadow:inset 0 -3px 0 #cbb98c;animation:cevir .45s ease-out}
  @keyframes cevir{0%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
  .t.parla span{background:#ffe27a;box-shadow:0 0 14px #ffd23f,inset 0 -3px 0 #c99a16}
  .t.imlec span{box-shadow:0 0 0 2px var(--altin),0 0 12px var(--altin),inset 0 -3px 0 #137067;animation:nabiz .8s infinite}
  @keyframes nabiz{50%{filter:brightness(1.35)}}
  .t.gecici span{background:linear-gradient(#ffe9a8,#f5c542);color:#3a2500;box-shadow:inset 0 -3px 0 #b88a10}
  .t.kayip span{background:linear-gradient(#ffd0cc,#f19d97);color:#5a1010}
  .ucan{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-weight:800;font-size:28px;color:var(--altin);
    text-shadow:0 2px 0 #6b3d00,0 0 12px rgba(0,0,0,.5);pointer-events:none;animation:ucan 1.1s ease-out forwards;white-space:nowrap}
  .ucan.kotu{color:#ff8a8c;text-shadow:0 2px 0 #5a0d10}
  @keyframes ucan{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}

  .msg{text-align:center;font-weight:700;font-size:15px;min-height:24px;margin:8px 0 4px;color:var(--ink);flex:none;line-height:1.25}
  .msg.iyi{color:#7ff0c8}.msg.kotu{color:#ff9a9c}.msg.altin{color:var(--altin)}

  /* orta: çark + düğmeler */
  .orta{flex:1;min-height:120px;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px}
  .cark{position:relative;flex:none;touch-action:none;cursor:grab}
  .cark canvas{display:block;width:100%;height:100%}
  .aks{display:flex;flex-direction:column;gap:8px;width:150px;flex:none}
  .btn{font:inherit;font-weight:800;font-size:17px;border:none;border-radius:14px;padding:9px 10px 7px;cursor:pointer;color:#2a1700;
    background:linear-gradient(#ffd866,#f0b429);box-shadow:0 4px 0 #a8710b;transition:transform .08s,filter .2s,opacity .2s;line-height:1.1}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a8710b}
  .btn small{display:block;font-size:11.5px;font-weight:700;opacity:.8}
  .btn.ikinci{background:linear-gradient(#a48cf0,#7b5cd6);color:#fff;box-shadow:0 4px 0 #4a3296}
  .btn.ucuncu{background:linear-gradient(#5ee3d4,#22a99c);color:#06302b;box-shadow:0 4px 0 #126e65}
  .orta.dikey{flex-direction:column;gap:10px}
  .orta.dikey .aks{flex-direction:row;width:100%}
  .orta.dikey .aks .btn{flex:1;font-size:16px;padding:8px 4px 6px}
  .orta.dikey .aks .btn small{font-size:11px}
  .orta.dikey #bCevir small{display:none}
  .btn.kapali{filter:grayscale(.85) brightness(.7);opacity:.6}

  /* klavye */
  .kl{flex:none;display:flex;flex-direction:column;gap:5px;margin-top:8px}
  .kr{display:flex;gap:4px;justify-content:center}
  .k{font:inherit;font-weight:800;font-size:17px;flex:0 1 38px;min-width:0;height:40px;border-radius:8px;border:none;cursor:pointer;
    background:#efe6ff;color:#2a1b55;box-shadow:0 3px 0 #9d8bd1;padding:2px 0 0;transition:opacity .2s,background .2s,transform .08s}
  .k:active{transform:translateY(2px);box-shadow:0 1px 0 #9d8bd1}
  .k.sesli{background:#fff1c2;box-shadow:0 3px 0 #d0a542}
  .k.soluk{opacity:.42}
  .k.var{background:#7ee8d6;box-shadow:0 3px 0 #2a9d8f;opacity:.55}
  .k.yok{background:#4a3d75;color:#8f84b6;box-shadow:0 3px 0 #2c2350;opacity:.6}

  /* katmanlar */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:30}
  .ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;
    background:rgba(10,5,28,.72);backdrop-filter:blur(3px)}
  .ov.gizli{display:none}
  .card{background:var(--kart);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:22px 20px 20px;
    width:100%;max-width:360px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.5);animation:gel .35s ease-out}
  @keyframes gel{from{transform:translateY(16px) scale(.96);opacity:0}}
  .card h2{font-size:30px;line-height:1.05;color:var(--altin);margin-bottom:8px;font-weight:800}
  .card p{color:var(--dim);font-size:15px;line-height:1.35;margin-bottom:12px}
  .card .soz{color:var(--ink);font-weight:800;font-size:18px;line-height:1.25;margin:4px 0 12px}
  .card .dok{text-align:left;font-size:15px;margin:0 auto 12px;max-width:250px}
  .card .dok div{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.12);padding:3px 0}
  .card .dok div b{color:var(--ink)}
  .card .dok div.top2{border:none;color:var(--altin);font-weight:800;font-size:17px}
  .card .buyuk{font-size:48px;font-weight:800;color:var(--ink);line-height:1;margin:4px 0}
  .card .btn{width:100%;font-size:20px;padding:11px}
  .mini{width:120px;height:120px;margin:-4px auto 6px;display:block}

  @media (max-width:420px){ .msg{font-size:14px} }
  @media (max-height:700px){ .k{height:36px} .pano{margin-top:6px} .msg{margin:5px 0 2px} }
  @media (min-width:700px){ .k{height:46px;font-size:19px;flex-basis:46px} .aks{width:180px} .baslik{font-size:26px} }
</style>
</head>
<body>
<div class="sahne">
  <div class="top">
    <a class="home" href="/">← Oyunhane</a>
    <div class="baslik">Atasözü Çarkı</div>
    <button class="snd" id="snd" aria-label="Ses">🔊</button>
  </div>
  <div class="hud">
    <div class="pill"><small>TUR</small><b id="hTur">1/5</b></div>
    <div class="pill"><small>KASA</small><b id="hKasa">0</b></div>
    <div class="pill"><small>TUR PUANI</small><b id="hPot">0</b></div>
    <div class="pill"><small>HIZ</small><b id="hHiz">300</b></div>
    <div class="pill"><small>CAN</small><div class="canlar" id="canlar"></div></div>
  </div>
  <div class="pano" id="pano"><div class="isik"></div>
    <div class="ic"><div class="kat">ATASÖZÜ</div><div id="tiles"></div></div>
  </div>
  <div class="msg" id="msg">&nbsp;</div>
  <div class="orta" id="orta">
    <div class="cark" id="cark"><canvas id="wheel"></canvas></div>
    <div class="aks">
      <button class="btn" id="bCevir">Çarkı çevir<small>Boşluk · ya da çarkı fırlat</small></button>
      <button class="btn ikinci" id="bSesli">Sesli harf al<small id="sesliFiyat">250 puan</small></button>
      <button class="btn ucuncu" id="bCoz">Çöz<small id="cozAlt">Enter</small></button>
    </div>
  </div>
  <div class="kl" id="kl"></div>
</div>
<canvas id="fx"></canvas>

<div class="ov" id="ovGiris"><div class="card">
  <svg class="mini" viewBox="0 0 120 120" aria-hidden="true">
    <g transform="translate(60 62)">
      <circle r="52" fill="#f5c542"/>
      <g id="miniDilim"></g>
      <circle r="11" fill="#f5c542" stroke="#7a4b00" stroke-width="3"/>
    </g>
    <path d="M52 2h16l-8 18z" fill="#fff6e0" stroke="#1d1340" stroke-width="2"/>
  </svg>
  <h2>Atasözü Çarkı</h2>
  <p>Çarkı çevir, çıkan puanla bir ünsüz seç; biriken puanla sesli harf al ve atasözünü bildiğin an <b style="color:#7ff0c8">Çöz</b>'e bas. Olmayan harf ve yanlış çözüm can götürür, İFLAS tur puanını sıfırlar.</p>
  <p id="enIyiGiris" style="margin-bottom:14px"></p>
  <button class="btn" id="bBasla">Başla</button>
</div></div>

<div class="ov gizli" id="ovTur"><div class="card">
  <h2 id="turBaslik">Bildin!</h2>
  <div class="soz" id="turSoz"></div>
  <div class="dok" id="turDok"></div>
  <button class="btn" id="bSonraki">Sonraki tur</button>
</div></div>

<div class="ov gizli" id="ovSon"><div class="card">
  <h2 id="sonBaslik">Oyun bitti</h2>
  <div class="soz" id="sonSoz"></div>
  <p style="margin-bottom:0">Skor</p>
  <div class="buyuk" id="sonSkor">0</div>
  <p id="sonAlt"></p>
  <button class="btn" id="bTekrar">Tekrar oyna</button>
</div></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const up = s => s.toLocaleUpperCase('tr-TR');
const HARFLER = 'ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ';
const SESLI = 'AEIİOÖUÜ';
const isSesli = c => SESLI.includes(c);
const TUR_SAYI = 5;
const BEST_KEY = 'oyunhane-atasozu-carki-best';

const SOZLER = [
  'Damlaya damlaya göl olur','Sakla samanı gelir zamanı','Ak akçe kara gün içindir','Ağaç yaşken eğilir',
  'Bugünün işini yarına bırakma','Dost acı söyler','Gülme komşuna gelir başına','İşleyen demir ışıldar',
  'Komşu komşunun külüne muhtaçtır','Tatlı dil yılanı deliğinden çıkarır','Üzüm üzüme baka baka kararır',
  'Yuvayı dişi kuş yapar','Az olsun öz olsun','Bin bilsen de bir bilene danış','Dereyi görmeden paçaları sıvama',
  'Emek olmadan yemek olmaz','Güneş balçıkla sıvanmaz','Keskin sirke küpüne zarar','Meyve veren ağacı taşlarlar',
  'Mum dibine ışık vermez','Ne ekersen onu biçersin','Öfkeyle kalkan zararla oturur','Su testisi su yolunda kırılır',
  'Taşıma su ile değirmen dönmez','Üzümünü ye bağını sorma','Yalancının mumu yatsıya kadar yanar',
  'Acele işe şeytan karışır','Aç ayı oynamaz','Aslan yattığı yerden belli olur','Bakarsan bağ olur bakmazsan dağ olur',
  'Balık baştan kokar','Bir elin nesi var iki elin sesi var','Bir musibet bin nasihatten iyidir','Boş çuval dik durmaz',
  'Çivi çiviyi söker','Dağ dağa kavuşmaz insan insana kavuşur','Davulun sesi uzaktan hoş gelir','Demir tavında dövülür',
  'Denize düşen yılana sarılır','Görünen köy kılavuz istemez','Her yokuşun bir inişi vardır','İt ürür kervan yürür',
  'Kervan yolda düzülür','Kol kırılır yen içinde','Dokuz ölç bir biç','Rüzgar eken fırtına biçer',
  'Sabreden derviş muradına ermiş','Tok açın halinden bilmez','Ayağını yorganına göre uzat','El elden üstündür',
  'Gülü seven dikenine katlanır','Hatasız kul olmaz','Lafla peynir gemisi yürümez','Sona kalan dona kalır',
  'Ateş düştüğü yeri yakar','Akıl akıldan üstündür','Gün doğmadan neler doğar','Su uyur düşman uyumaz',
  'Her koyun kendi bacağından asılır','Bir fincan kahvenin kırk yıl hatırı vardır','Atılan ok geri dönmez',
  'Mart kapıdan baktırır kazma kürek yaktırır','Kaz gelecek yerden tavuk esirgenmez','Eski dost düşman olmaz',
  'Can çıkmayınca huy çıkmaz','Ne doğrarsan aşına o gelir kaşığına','Ateş olmayan yerden duman çıkmaz',
  'Ağlamayan çocuğa meme vermezler','Kedi uzanamadığı ciğere mundar der','Körle yatan şaşı kalkar',
  'Isıracak it dişini göstermez','Çok bilen çok yanılır','Ummadığın taş baş yarar','Yalnız taş duvar olmaz',
  'Kurt dumanlı havayı sever','Yumuşak huylu atın çiftesi pek olur'
];

/* ---------- ses ---------- */
let ac = null, sesAcik = true;
try { sesAcik = localStorage.getItem('oyunhane-ses') !== '0'; } catch (e) {}
function sesHazir(){ if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }
function ton(f, d, tip = 'sine', v = .15, gec = 0, f2 = null){
  if (!ac || !sesAcik) return;
  const t = ac.currentTime + gec, o = ac.createOscillator(), g = ac.createGain();
  o.type = tip; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0008, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
const S = {
  tik: () => ton(1900, .03, 'square', .045),
  ding: (k = 0) => { ton(988 * Math.pow(1.06, k), .35, 'sine', .14); ton(1976 * Math.pow(1.06, k), .25, 'sine', .05); },
  buzz: () => { ton(140, .35, 'sawtooth', .1); ton(95, .4, 'square', .06, .05); },
  iflas: () => { ton(520, .7, 'sawtooth', .09, 0, 70); },
  kazan: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => ton(f, .3, 'triangle', .12, i * .09)); },
  joker: () => { [784, 988, 1175].forEach((f, i) => ton(f, .2, 'sine', .12, i * .07)); },
  yaz: () => ton(660, .08, 'triangle', .08),
};
$('#snd').textContent = sesAcik ? '🔊' : '🔈';
$('#snd').onclick = () => { sesAcik = !sesAcik; $('#snd').textContent = sesAcik ? '🔊' : '🔈'; try { localStorage.setItem('oyunhane-ses', sesAcik ? '1' : '0'); } catch (e) {} };

/* ---------- en iyi skor ---------- */
function enIyiOku(){ try { return +localStorage.getItem(BEST_KEY) || 0; } catch (e) { return 0; } }
function enIyiYaz(v){ try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {} }

/* ---------- durum ---------- */
let phrase = '', acik = new Set(), kullanilan = new Set();
let tur = 0, can = 3, kasa = 0, pot = 0, durum = 'giris', segDeger = 0, gecen = 0;
let secilenler = [], sonOyun = [], cozIdx = [], cozPos = 0, tileEl = [], segs = [];

const sesliFiyat = () => 200 + tur * 50;
const hizBonus = () => Math.max(0, Math.round(300 - gecen * 5));
const harfVar = c => phrase.includes(c);
const kapaliHarfler = () => [...phrase].map((c, i) => i).filter(i => phrase[i] !== ' ' && !acik.has(phrase[i]));
const kalanUnsuz = () => [...new Set([...phrase].filter(c => c !== ' ' && !isSesli(c) && !acik.has(c)))];

/* ---------- pano ---------- */
function panoKur(){
  const box = $('#tiles'); box.innerHTML = ''; tileEl = [];
  const W = $('.ic').clientWidth - 12;
  const words = []; let i = 0;
  for (const w of phrase.split(' ')) { words.push({ w, s: i }); i += w.length + 1; }
  let rows = [];
  for (let cols = W < 460 ? 12 : 15; cols < 30; cols++) {
    rows = []; let cur = [], len = 0;
    for (const wd of words) {
      const add = (cur.length ? 1 : 0) + wd.w.length;
      if (cur.length && len + add > cols) { rows.push(cur); cur = []; len = 0; }
      len += (cur.length ? 1 : 0) + wd.w.length; cur.push(wd);
    }
    if (cur.length) rows.push(cur);
    if (rows.length <= 4) break;
  }
  let t = 40;
  for (const r of rows) {
    const harf = r.reduce((s, x) => s + x.w.length, 0), ara = r.reduce((s, x) => s + x.w.length - 1, 0);
    t = Math.min(t, (W - 3 * ara) / (harf + 0.38 * (r.length - 1)));
  }
  t = Math.max(16, Math.floor(t));
  box.style.setProperty('--t', t + 'px');
  for (const r of rows) {
    const rd = document.createElement('div'); rd.className = 'row';
    for (const wd of r) {
      const wdv = document.createElement('div'); wdv.className = 'w';
      for (let k = 0; k < wd.w.length; k++) {

const RENK = ['#ef5d60', '#f5a742', '#2ec4b6', '#7b5cd6', '#3a86ff', '#46b96b', '#e76fb3', '#f5c542'];

const cv = $('#wheel'), cx = cv.getContext('2d');

    cx.fillStyle = v === 'İFLAS' ? '#ff6b6e' : v === 'JOKER' ? '#7b5cd6' : v === 'CAN' ? '#8a1030' : '#fff';

let surukle = null;
function aci(e){ const b = cv.getBoundingClientRect(); return Math.atan2(e.clientY - b.top - b.height / 2, e.clientX - b.left - b.width / 2); }

function karistir(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

    gecen += dt; const h = hizBonus(); const e = $('#hHiz'); if (e.textContent !== String(h)) e.textContent = h;
  }
  if (parca.length) {
    fc.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parca) { p.t += dt; p.vy += 700 * dt; p.vx *= .99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      fc.save(); fc.translate(p.x, p.y); fc.rotate(p.r); fc.fillStyle = p.c; fc.globalAlpha = Math.max(0, 1 - p.t / 2.2); fc.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); fc.restore(); }
    parca = parca.filter(p => p.t < 2.2 && p.y < innerHeight + 20);
    if (!parca.length) fc.clearRect(0, 0, innerWidth, innerHeight);
  }
  requestAnimationFrame(dongu);
}
