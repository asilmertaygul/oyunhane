<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oyunhane — her gün yeni bir mini oyun</title>
<meta name="description" content="Her gün yeni bir küçük tarayıcı oyunu. Kurulum yok, hesap yok; aç ve oyna.">
<meta name="theme-color" content="#2340c9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232340c9'/%3E%3Crect x='14' y='14' width='36' height='38' rx='5' fill='%23fbfbf7'/%3E%3Crect x='14' y='14' width='36' height='11' rx='5' fill='%23ffcf33'/%3E%3Ccircle cx='32' cy='39' r='6' fill='%232340c9'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --cobalt:#2340c9;--deep:#18298a;--paper:#fbfbf7;--ink:#151a33;--sun:#ffcf33;--mint:#3ddc97;--soft:#5a6283;
  --disp:"Bricolage Grotesque",system-ui,sans-serif;--body:"Atkinson Hyperlegible",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cobalt);color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.6px);background-size:22px 22px}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.wrap{width:min(1120px,100%);margin:0 auto;padding:0 16px}

/* üst şerit */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:-.01em}
.logo svg{width:34px;height:34px}
.count{font-size:15px;color:#c9d2ff}

/* bugünün yaprağı */
.today{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:40px;align-items:center;padding:34px 0 56px}
.leaf{background:var(--paper);color:var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 10px 0 var(--deep),0 24px 50px rgba(10,20,80,.35);transform:rotate(-2.5deg);text-align:center;position:relative}
.leaf .ring{background:var(--sun);padding:12px 10px 10px;font-family:var(--disp);font-weight:700;font-size:18px;position:relative}
.leaf .ring::before,.leaf .ring::after{content:"";position:absolute;top:-6px;width:12px;height:22px;border-radius:6px;background:var(--deep)}
.leaf .ring::before{left:26%}.leaf .ring::after{right:26%}
.leaf .day{font-family:var(--disp);font-weight:800;font-size:clamp(110px,16vw,168px);line-height:.95;letter-spacing:-.05em;padding:14px 0 0}
.leaf .month{font-family:var(--disp);font-weight:700;font-size:22px;padding:0 0 20px;color:var(--soft)}
.leaf .tear{height:10px;background:radial-gradient(circle at 8px -3px,transparent 8px,var(--paper) 8.5px) repeat-x;background-size:16px 10px;position:absolute;bottom:-10px;left:0;right:0}
.pitch h1{font-family:var(--disp);font-weight:800;font-size:clamp(40px,6.4vw,76px);line-height:1;letter-spacing:-.03em;margin:8px 0 14px}
.pitch .kicker{font-size:17px;color:#c9d2ff;margin:0}
.pitch p.desc{font-size:19px;max-width:34em;margin:0 0 26px;color:#e8ecff}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--sun);color:var(--ink);text-decoration:none;font-family:var(--disp);font-weight:800;font-size:21px;padding:14px 30px;border-radius:12px;box-shadow:0 5px 0 #b38a00;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #b38a00}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b38a00}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.pill{font-size:14px;font-weight:700;border-radius:999px;padding:3px 12px;background:rgba(255,255,255,.14)}
.pill.online{background:var(--mint);color:var(--ink)}

/* bölümler */
section{padding:0 0 56px}
h2{font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:-.02em;margin:0 0 6px}
.sub{margin:0 0 22px;color:#c9d2ff}
.bar{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:22px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:inherit;font-size:15px;font-weight:700;border:2px solid rgba(255,255,255,.35);background:transparent;color:var(--paper);border-radius:999px;padding:5px 14px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}

/* arşiv yaprakları */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px 20px}
.tile{display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border-radius:12px;text-decoration:none;overflow:hidden;box-shadow:0 6px 0 var(--deep);transition:transform .12s}
.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile .cover{aspect-ratio:4/3;display:grid;place-items:center;position:relative;overflow:hidden}
.tile .cover img{width:100%;height:100%;object-fit:cover;display:block}
.tile .cover .mono{font-family:var(--disp);font-weight:800;font-size:76px;color:rgba(255,255,255,.92);letter-spacing:-.04em}
.tile .stamp{position:absolute;top:10px;left:10px;background:var(--paper);color:var(--ink);border-radius:8px;padding:2px 9px;font-family:var(--disp);font-weight:700;font-size:15px}
.tile .info{padding:12px 14px 16px}
.tile b{display:block;font-family:var(--disp);font-weight:800;font-size:21px;line-height:1.15;letter-spacing:-.01em}
.tile span{display:block;font-size:14.5px;color:var(--soft);margin-top:3px}
.empty{background:rgba(255,255,255,.1);border:2px dashed rgba(255,255,255,.35);border-radius:12px;padding:26px;color:#e8ecff}

/* büyük oyunlar */
.big{display:grid;grid-template-columns:1.3fr 1fr;background:var(--ink);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--paper);box-shadow:0 8px 0 var(--deep)}
.big img{width:100%;height:100%;min-height:240px;object-fit:cover;display:block}
.big .txt{padding:26px 28px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.big b{font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:-.02em;line-height:1}
.big p{margin:0;color:#c9cde0}
.big .go{color:var(--sun);font-weight:700}

footer{padding:26px 0 44px;color:#c9d2ff;font-size:15px;border-top:2px solid rgba(255,255,255,.18)}

@media (max-width:760px){
  .today{grid-template-columns:1fr;gap:30px;padding:16px 0 44px}
  .leaf{max-width:260px;margin:0 auto}
  .pitch{text-align:center}.pitch p.desc{margin-inline:auto}.meta{justify-content:center}
  .big{grid-template-columns:1fr}.big img{min-height:0;aspect-ratio:16/9}
  .count{display:none}
  .shelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
  .tile .cover .mono{font-size:52px}
  .tile b{font-size:18px}
  .tile .info{padding:10px 11px 13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="/"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="8" width="48" height="50" rx="8" fill="#fbfbf7"/><rect x="8" y="8" width="48" height="15" rx="8" fill="#ffcf33"/><circle cx="32" cy="41" r="8" fill="#2340c9"/></svg>Oyunhane</a>
    <span class="count" id="count"></span>
  </header>

  <main>
    <div class="today" id="today" aria-live="polite">
      <div class="leaf" aria-hidden="true">
        <div class="ring" id="leafWeekday">&nbsp;</div>
        <div class="day" id="leafDay">&nbsp;</div>
        <div class="month" id="leafMonth">&nbsp;</div>
        <div class="tear"></div>
      </div>
      <div class="pitch" id="pitch">
        <p class="kicker">Oyunlar yükleniyor…</p>
      </div>
    </div>

    <section id="arsiv">
      <div class="bar">
        <div>
          <h2>Bütün günler</h2>
          <p class="sub" style="margin:0">Her gün bir tane eklenir. Kaçırdığın günleri buradan oyna.</p>
        </div>
        <div class="filters" role="group" aria-label="Oyunları süz">
          <button type="button" data-f="hepsi" aria-pressed="true">Hepsi</button>
          <button type="button" data-f="tek" aria-pressed="false">Tek kişilik</button>
          <button type="button" data-f="online" aria-pressed="false">Arkadaşlarla</button>
        </div>
      </div>
      <div class="shelf" id="shelf"></div>
    </section>

    <section id="buyuk">
      <h2>Büyük oyunlar</h2>
      <p class="sub">Günlük oyunlardan uzun soluklu olanlar.</p>
      <div id="bigList" style="display:grid;gap:20px"></div>
    </section>
  </main>

  <footer>Oyunhane · Her sabah yeni bir oyun, tarayıcıda, kurulumsuz.</footer>
</div>

<script>
(async()=>{
  const TZ='Europe/Istanbul';
  const todayKey=new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date()); // YYYY-MM-DD
  const fmt=(o)=>new Intl.DateTimeFormat('tr-TR',{timeZone:'UTC',...o});
  const asDate=k=>new Date(k+'T12:00:00Z');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const label=k=>k===todayKey?'Bugün':fmt({day:'numeric',month:'short'}).format(asDate(k));

  // yaprağa bugünün tarihi
  const t=asDate(todayKey);
  leafWeekday.textContent=fmt({weekday:'long'}).format(t);
  leafDay.textContent=fmt({day:'numeric'}).format(t);
  leafMonth.textContent=fmt({month:'long',year:'numeric'}).format(t);

  let games=[];
  try{const r=await fetch('/games.json',{cache:'no-cache'});if(!r.ok)throw 0;games=await r.json();}
  catch(_){pitch.innerHTML='<p class="kicker">Oyun listesi açılamadı.</p><h1>Sayfayı yenile</h1><p class="desc">Sorun sürerse birkaç dakika sonra tekrar dene.</p>';return;}

  const daily=games.filter(g=>!g.buyuk&&g.tarih<=todayKey).sort((a,b)=>b.tarih.localeCompare(a.tarih));
  const big=games.filter(g=>g.buyuk);
  count.textContent=daily.length?`${daily.length} günlük oyun`:'';

  const pills=g=>`<span class="pill">${esc(g.tur)}</span>${g.oyuncu==='online'?'<span class="pill online">Arkadaşlarla online</span>':'<span class="pill">Tek kişilik</span>'}`;

  // bugünün oyunu
  const g0=daily[0];
  if(g0&&g0.tarih===todayKey){
    pitch.innerHTML=`<p class="kicker">Bugünün oyunu</p><h1>${esc(g0.ad)}</h1><div class="meta">${pills(g0)}</div><p class="desc">${esc(g0.aciklama)}</p><a class="btn" href="/${esc(g0.slug)}/">Oyna</a>`;
  }else if(g0){
    pitch.innerHTML=`<p class="kicker">Bugünün oyunu hazırlanıyor. Bu arada dünün oyunu:</p><h1>${esc(g0.ad)}</h1><div class="meta">${pills(g0)}</div><p class="desc">${esc(g0.aciklama)}</p><a class="btn" href="/${esc(g0.slug)}/">Oyna</a>`;
  }else{
    pitch.innerHTML='<p class="kicker">Bugünün oyunu</p><h1>İlk oyun yolda</h1><p class="desc">Günlük oyunlar her sabah buraya eklenecek. O zamana kadar aşağıdaki büyük oyunu dene.</p><a class="btn" href="#buyuk">Büyük oyunlara git</a>';
  }

  // arşiv
  const tile=g=>{
    const cover=g.kapak?`<img src="${esc(g.kapak)}" alt="" loading="lazy">`:`<span class="mono">${esc((g.ad||'?').trim()[0])}</span>`;
    return `<a class="tile" href="/${esc(g.slug)}/" data-o="${g.oyuncu==='online'?'online':'tek'}"><div class="cover" style="background:${esc(g.renk||'#18298a')}">${cover}<span class="stamp">${label(g.tarih)}</span></div><div class="info"><b>${esc(g.ad)}</b><span>${esc(g.tur)} · ${g.oyuncu==='online'?'Arkadaşlarla':'Tek kişilik'}</span></div></a>`;
  };
  const renderShelf=f=>{
    const list=daily.filter(g=>f==='hepsi'||(f==='online'?g.oyuncu==='online':g.oyuncu!=='online'));
    shelf.innerHTML=list.length?list.map(tile).join(''):`<div class="empty">${daily.length?'Bu türde henüz oyun yok. Başka bir filtre seç.':'İlk günlük oyun eklendiğinde burada görünecek.'}</div>`;
  };
  renderShelf('hepsi');
  document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderShelf(b.dataset.f);}));

  // büyük oyunlar
  bigList.innerHTML=big.map(g=>`<a class="big" href="/${esc(g.slug)}/"><img src="${esc(g.kapak)}" alt=""><div class="txt"><div class="meta" style="margin:0">${pills(g)}</div><b>${esc(g.ad)}</b><p>${esc(g.aciklama)}</p><span class="go">Oyna</span></div></a>`).join('');
  if(!big.length)document.getElementById('buyuk').hidden=true;
})();
</script>
</body>
</html>
