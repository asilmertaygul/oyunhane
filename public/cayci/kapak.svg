  <path d="M181 255 L177 240 Q176 222 183 212 Q186 205 183 185 Q178 160 168 140 L232 140 Q222 160 217 185 Q214 205 217 212 Q224 222 223 240 L219 255 Z" fill="rgba(220,235,245,.08)" stroke="rgba(240,248,255,.85)" stroke-width="2.5"/>
