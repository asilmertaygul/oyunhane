<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="duvar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d1c12"/><stop offset="1" stop-color="#5a2a18"/></linearGradient>
    <linearGradient id="tezgah" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5230"/><stop offset="1" stop-color="#3e200f"/></linearGradient>
    <linearGradient id="cay" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a82a14"/><stop offset=".4" stop-color="#d0472a"/><stop offset="1" stop-color="#7a1c0c"/></linearGradient>
    <linearGradient id="celik" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d8a91"/><stop offset=".4" stop-color="#eef2f4"/><stop offset="1" stop-color="#7d8a91"/></linearGradient>
    <clipPath id="cam"><path d="M181 255 L177 240 Q176 222 183 212 Q186 205 183 185 Q178 160 168 140 L232 140 Q222 160 217 185 Q214 205 217 212 Q224 222 223 240 L219 255 Z"/></clipPath>
    <pattern id="cini" width="40" height="40" patternUnits="userSpaceOnUse">
