      <circle cx="20" cy="20" r="4.5" fill="#c0391c"/>
      <circle cx="0" cy="0" r="6" fill="#2f6f8f"/><circle cx="40" cy="0" r="6" fill="#2f6f8f"/><circle cx="0" cy="40" r="6" fill="#2f6f8f"/><circle cx="40" cy="40" r="6" fill="#2f6f8f"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#duvar)"/>
  <rect y="200" width="400" height="40" fill="url(#cini)"/>
  <rect y="240" width="400" height="60" fill="url(#tezgah)"/>
  <rect y="240" width="400" height="4" fill="#a8683f"/>
