    <ellipse cx="0" cy="-46" rx="7" ry="5" fill="#2b2b2b"/>
  </g>
  <!-- tabak -->
  <ellipse cx="200" cy="262" rx="66" ry="12" fill="rgba(0,0,0,.3)"/>
  <ellipse cx="200" cy="256" rx="62" ry="12" fill="#f6f1ea"/>
  <ellipse cx="200" cy="256" rx="56" ry="9.5" fill="none" stroke="#c0391c" stroke-width="3"/>
