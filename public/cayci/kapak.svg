  <g fill="#ffd54a"><path d="M262 172 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3Z"/><path d="M130 196 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2Z"/></g>
