    <path d="M40 -30 Q66 0 42 34" stroke="#2b2b2b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-30 -36 C-62 -20 -62 46 -22 52 L22 52 C62 46 62 -20 30 -36Z" fill="url(#celik)" stroke="rgba(0,0,0,.3)"/>
