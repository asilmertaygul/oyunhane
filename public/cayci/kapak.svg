    <path d="M-88 -26 C-104 -16 -104 26 -82 28 L-62 28 C-40 26 -40 -16 -56 -26Z" fill="url(#celik)" stroke="rgba(0,0,0,.3)"/>
    <ellipse cx="-72" cy="-26" rx="20" ry="5" fill="#dfe5e8" stroke="rgba(0,0,0,.3)"/>
    <ellipse cx="-72" cy="-33" rx="5" ry="3.5" fill="#2b2b2b"/>
  </g>
  <!-- akış -->
  <path d="M191 93 Q197 120 199 190" stroke="#6e1608" stroke-width="5" fill="none" stroke-linecap="round"/>
