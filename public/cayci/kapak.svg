  <path d="M152 154 L163 160 L152 166Z M248 154 L237 160 L248 166Z" fill="#ffd54a"/>
  <!-- buhar -->
  <g fill="none" stroke="rgba(255,255,255,.35)" stroke-width="4" stroke-linecap="round">
    <path d="M190 132 q-8 -12 0 -24 q8 -12 0 -24"/>
    <path d="M212 128 q8 -12 0 -24 q-8 -12 0 -22"/>
